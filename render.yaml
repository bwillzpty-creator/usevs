services:
  - type: web
    name: usevs
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /landing
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYFAST_SANDBOX
        value: "true"
      - key: PAYFAST_RETURN_URL
        value: https://usevs.onrender.com/payfast/return
      - key: PAYFAST_CANCEL_URL
        value: https://usevs.onrender.com/payfast/cancel
      - key: PAYFAST_NOTIFY_URL
        value: https://usevs.onrender.com/payfast/notify
      - key: PAYFAST_ONCE_OFF_AMOUNT
        value: "4.99"
      - key: PAYFAST_SUBSCRIPTION_AMOUNT
        value: "24.99"
      - key: PUBLIC_BASE_URL
        value: https://usevs.onrender.com
      - key: DATA_DIR
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: ISSUER_REVIEW_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
