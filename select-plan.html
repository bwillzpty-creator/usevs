<!doctype html>
<html lang="en">
<head>
<meta name="google-site-verification" content="tAaxqH58kH1zeQUI8WptqfLNtyzIOML6cmO0szMBrGw" />
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a plan | US-EVS</title>
  <style>
    body { margin: 0; font-family: "Source Sans 3 Variable", Arial, sans-serif; background: #f4f6fa; color: #14213d; }
    main { max-width: 1040px; margin: 0 auto; padding: 56px 20px; text-align: center; }
    h1 { font-size: 1.9rem; margin: 0 0 12px; }
    .banner { display: none; margin: 0 auto 24px; max-width: 720px; padding: 14px 18px; border: 1px solid #f0b429; background: #fff8e1; border-radius: 8px; font-weight: 600; }
    .banner.show { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 32px; text-align: left; }
    .card { background: #fff; border: 1px solid #d8deea; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; }
    .card.featured { border-color: #e8590c; box-shadow: 0 6px 20px rgba(232, 89, 12, .15); }
    .card h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .price strong { font-size: 2rem; }
    .price span { margin-left: 6px; color: #5c6b85; }
    ul { padding-left: 18px; flex: 1; }
    button { display: block; width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #e8590c; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .note { margin-top: 24px; font-size: .9rem; color: #5c6b85; }
    #error { min-height: 22px; margin-top: 16px; color: #a12828; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="banner" id="gateBanner" role="alert"></div>
    <h1>Choose how long you need access.</h1>
    <p>Pay once for the period you need. No subscription, no automatic renewal.</p>
    <div class="grid" id="plans"></div>
    <p id="error" role="alert"></p>
    <p class="note">Secure checkout by Stripe. Access activates as soon as payment is confirmed and you are taken straight to your dashboard.</p>
  </main>
  <script>
    const DETAILS = {
      '1_day': { period: 'for 1 day', points: ['Full workspace access for 24 hours', 'Unlimited verification letters', 'PDF export'] },
      '1_week': { period: 'for 1 week', points: ['Full workspace access for 7 days', 'Unlimited verification letters', 'Audit trail for active cases'], featured: true },
      '1_month': { period: 'for 1 month', points: ['Full workspace access for 1 month', 'Recruiter and small-team workflows', 'Audit trail for active cases'] },
      '1_year': { period: 'for 1 year', points: ['Full workspace access for 1 year', 'High-volume verification generation', 'Tracking, storage, and audit retention'] }
    };
    const params = new URLSearchParams(location.search);
    const banner = document.getElementById('gateBanner');
    const errorBox = document.getElementById('error');
    const messages = {
      required: 'An active plan is required to access workspace tools.',
      incomplete: 'Your payment has not been completed yet. Choose a plan to try again.',
      error: 'We could not confirm your payment. If you were charged, access will activate automatically within a few minutes.'
    };
    const bannerKey = params.get('required') === '1' ? 'required' : params.get('payment');
    if (messages[bannerKey]) {
      banner.textContent = messages[bannerKey];
      banner.classList.add('show');
    }

    function money(cents) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(cents / 100);
    }

    async function startCheckout(plan) {
      errorBox.textContent = '';
      document.querySelectorAll('button').forEach((item) => { item.disabled = true; });
      try {
        const response = await fetch('/api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ plan })
        });
        const result = await response.json().catch(() => ({}));
        if (response.status === 401) return location.assign('/login?next=/select-plan');
        if (!response.ok || !result.url) throw new Error(result.message || 'Unable to start checkout.');
        location.assign(result.url);
      } catch (error) {
        errorBox.textContent = error.message;
        document.querySelectorAll('button').forEach((item) => { item.disabled = false; });
      }
    }

    async function init() {
      const session = await fetch('/api/auth/session', { credentials: 'same-origin' });
      if (session.status === 401) return location.replace('/register');
      const { plans } = await (await fetch('/api/plans')).json();
      const grid = document.getElementById('plans');
      for (const plan of plans) {
        const detail = DETAILS[plan.id];
        const card = document.createElement('article');
        card.className = `card${detail.featured ? ' featured' : ''}`;
        card.dataset.plan = plan.id;
        const title = document.createElement('h2');
        title.textContent = plan.label;
        const price = document.createElement('div');
        price.className = 'price';
        price.innerHTML = '<strong></strong><span></span>';
        price.querySelector('strong').textContent = money(plan.priceCents);
        price.querySelector('span').textContent = detail.period;
        const list = document.createElement('ul');
        for (const point of detail.points) list.append(Object.assign(document.createElement('li'), { textContent: point }));
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = `Get ${plan.label}`;
        button.addEventListener('click', () => startCheckout(plan.id));
        card.append(title, price, list, button);
        grid.append(card);
      }
    }
    init().catch(() => { errorBox.textContent = 'Unable to load plans. Please refresh the page.'; });
  </script>
</body>
</html>
